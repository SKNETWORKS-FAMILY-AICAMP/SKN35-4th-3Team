{% load static %}
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>생활법률 상담</title>
  <link rel="stylesheet" href="{% static 'chat/chat.css' %}">
</head>
<body>
  <main class="chat-shell">
    <header>
      <p class="eyebrow">SKN35 4차 프로젝트</p>
      <h1>생활법률 상담</h1>
      <p>질문과 관련 문서 이미지를 입력하면 법령·판례 근거를 검색합니다.</p>
    </header>

    <form id="chat-form" data-endpoint="{{ chat_endpoint }}">
      {% csrf_token %}
      <label for="question">상담 내용</label>
      <textarea id="question" name="question" rows="7" required
        placeholder="거래 과정, 날짜, 금액 등 상황을 구체적으로 입력해 주세요."></textarea>

      <label for="files">첨부파일</label>
      <input id="files" name="files" type="file" multiple
        accept=".png,.jpg,.jpeg,.pdf,image/png,image/jpeg,application/pdf">
      <small>PDF는 최대 {{ pdf_max_pages }}페이지까지 확인합니다.</small>

      <button type="submit">상담 요청</button>
    </form>

    <section id="result" aria-live="polite" hidden>
      <p id="status"></p>
      <h2>답변</h2>
      <div id="answer"></div>
      <h2>확인된 출처</h2>
      <ul id="sources"></ul>
    </section>
  </main>
  <script src="{% static 'chat/chat.js' %}" defer></script>
</body>
</html>
