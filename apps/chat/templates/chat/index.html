{% load static %}
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>생활법률 상담</title>
  <link rel="stylesheet" href="{% static 'chat/chat.css' %}">
</head>
<body>
  <main class="chat-shell">
    <header class="chat-header">
      <p class="eyebrow">SKN35 4차 프로젝트</p>
      <h1>생활법률 상담</h1>
    </header>

    <section id="messages" class="messages" aria-live="polite">
      <div class="msg bot">
        <div class="bubble">
          안녕하세요! 거래 과정, 날짜, 금액 등 상황을 구체적으로 알려주시면 관련 법령·판례 근거를 검색해 드릴게요. 관련 문서는 이미지나 PDF로 첨부할 수 있어요.
        </div>
      </div>
    </section>

    <form id="chat-form" data-endpoint="{{ chat_endpoint }}">
      {% csrf_token %}
      <ul id="file-list" class="file-list" hidden></ul>
      <div class="composer">
        <label class="attach-btn" for="files" title="파일 첨부">＋</label>
        <input id="files" name="files" type="file" multiple hidden
          accept=".png,.jpg,.jpeg,.pdf,image/png,image/jpeg,application/pdf">
        <textarea id="question" name="question" rows="1" required
          placeholder="상담 내용을 입력해 주세요."></textarea>
        <button type="submit">전송</button>
      </div>
      <small class="hint">PDF는 최대 {{ pdf_max_pages }}페이지까지 확인합니다.</small>
    </form>
  </main>
  <script src="{% static 'chat/chat.js' %}" defer></script>
</body>
</html>
